# Local stack in one command: MongoDB + the API built from this Dockerfile.
#   docker compose up --build
# Then sign in with SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD (defaults below).
# For local use only; production runs on Render with MongoDB Atlas.

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job with the same image: builds the declared indexes (production disables
  # autoIndex) and upserts the admin account. Both scripts are safe to run on every start.
  setup:
    build: .
    command: ['sh', '-c', 'node dist/scripts/sync-indexes.js && node dist/scripts/create-admin.js']
    environment: &api-env
      MONGODB_URI: mongodb://mongo:27017/doctor-tracker
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@doctortracker.dev}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment: *api-env
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  mongo-data:
